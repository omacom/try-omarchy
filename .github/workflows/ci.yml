name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.target == 'test' && 'Test suites' || 'Runtime build' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        target: [test, runtime]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This compiles the Swift product and runs the native, shell, and guest
      # contract suites. The full build additionally requires privileged ARM64
      # Docker, which is unavailable on GitHub-hosted macOS runners.
      - name: Run test suite
        if: matrix.target == 'test'
        run: make test

      - name: Install runtime build tool
        if: matrix.target == 'runtime'
        run: command -v pkg-config || brew install pkg-config

      # Build the actual graphics stack and QEMU on both supported OS families.
      # Includes VirGL shader regressions and the complete binary compatibility audit.
      - name: Build and verify native runtime
        if: matrix.target == 'runtime'
        run: make runtime

  # A failed, cancelled, or skipped matrix leg must not turn the summary green.
  summary:
    name: CI summary
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all tests and runtime builds
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
