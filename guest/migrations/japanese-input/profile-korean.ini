[Groups/0]
Name=Default
Default Layout=us
# DefaultIM= below is inert: fcitx5 resolves the group's real default from
# Items order and rewrites this line (to chewing) on first save. What keeps
# English users unaffected is keyboard-us being Items/0, ahead of chewing —
# don't "fix" that ordering to match this line.
DefaultIM=keyboard-us

[Groups/0/Items/0]
Name=keyboard-us
Layout=

[Groups/0/Items/1]
Name=chewing
Layout=

# Korean is its own group, so the Default group above stays exactly as it was.
# Select it once with `fcitx5-remote -g Korean`; fcitx5 saves the current group
# first in GroupOrder, so the choice survives restarts. Inside this group
# Ctrl+Space toggles between US and Hangul only.
[Groups/1]
Name=Korean
Default Layout=us
DefaultIM=hangul

[Groups/1/Items/0]
Name=keyboard-us
Layout=

[Groups/1/Items/1]
Name=hangul
Layout=

[GroupOrder]
0=Default
1=Korean
