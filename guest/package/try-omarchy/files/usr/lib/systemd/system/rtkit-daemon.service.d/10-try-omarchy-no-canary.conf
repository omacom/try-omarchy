# RTKit's watchdog (its canary) takes any 10 s in which the VM did not run
# while its clock went on, as when the app pauses the VM for Mac sleep, for a
# runaway real-time thread, and demotes every real-time thread for the rest of
# the session: PipeWire then runs at normal priority and the sound crackles
# whenever the VM is busy. Runaway threads are still contained: RTKit grants
# real-time only with RLIMIT_RTTIME set. Adapted from OmacVM (MIT).
[Service]
ExecStart=
ExecStart=/usr/lib/rtkit-daemon --no-canary
