[Service]
ExecStartPre=/usr/lib/try-omarchy/factory-boot-identity
# The setup form lists `timedatectl list-timezones`; Try Omarchy's stand-in
# puts Same as macOS first, and the form defaults preselect it, so keeping the
# default follows the Mac.
Environment=PATH=/usr/lib/try-omarchy/shims:/usr/bin
ExecStartPre=-/usr/lib/try-omarchy/setup-form-defaults
EnvironmentFile=-/run/try-omarchy/setup-form.env
# The native VM disk is protected by the macOS account, and SDDM's X11 greeter
# does not render through this VirGL path. Keep the direct Omarchy login that
# provisioning created instead of arming the unencrypted-install cleanup.
ExecStartPost=/usr/bin/rm -f /etc/systemd/system/graphical.target.wants/omarchy-provision-autologin-once.service /etc/systemd/system/omarchy-provision-autologin-once.service
# Give the new owner Try Omarchy's per-user setup before the first session
# starts, so the VM display profile is active from the first frame.
ExecStartPost=-/usr/lib/try-omarchy/owner-setup
