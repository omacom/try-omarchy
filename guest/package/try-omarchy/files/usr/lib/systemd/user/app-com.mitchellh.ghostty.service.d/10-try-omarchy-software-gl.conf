# D-Bus activation starts Ghostty through this unit; run it through Try
# Omarchy's software-renderer wrapper like every other launch.
[Service]
ExecStart=
ExecStart=/usr/lib/try-omarchy/bin/ghostty --gtk-single-instance=true --initial-window=false
# Ghostty 1.3.1's notify-reload unit fails under systemd 262: Ghostty reports
# ready before it handles SIGUSR2, so systemd refuses to start it. Readiness
# by bus name avoids that; Omarchy reloads Ghostty with SIGUSR2 directly.
Type=dbus
