# WebRTC echo cancellation for the Mac microphone, run as its own PipeWire
# client by try-omarchy-mic-echo-cancel only while an app records. Running it
# permanently would keep the Mac microphone open whenever anything plays.
#
# Capture follows the default source, so the Mac input chosen in the audio
# menu still applies. In monitor mode the echo reference is the speaker's
# monitor, so everything played is cancelled.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
  { name = libpipewire-module-rt
    args = { }
    flags = [ ifexists nofail ]
  }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = true
      audio.channels = 1
      audio.position = [ MONO ]
      node.latency = 960/48000
      buffer.max_size = 500
      aec.args = {
        webrtc.extended_filter = true
        webrtc.delay_agnostic = true
        webrtc.high_pass_filter = true
        webrtc.noise_suppression = true
        webrtc.gain_control = false
      }
      capture.props = {
        node.name = "echo-cancel-capture"
        node.passive = true
      }
      sink.props = {
        node.name = "echo-cancel-reference"
        node.passive = true
      }
      source.props = {
        node.name = "echo-cancel-source"
        node.description = "Mac Mic (Echo Cancelled)"
      }
    }
  }
]
