# Older apps give the VM an emulated Intel HDA card, whose playback position
# advances in coarse jumps when the host services audio late. At the default
# quantum those jumps cause xruns, so an HDA card runs the graph at 4096
# frames. The virtio-sound card newer apps use reports its position as it
# plays and keeps PipeWire's default.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.driver_name = "snd_hda_intel" }
    ]
    actions = {
      update-props = {
        node.force-quantum = 4096
      }
    }
  }
]
