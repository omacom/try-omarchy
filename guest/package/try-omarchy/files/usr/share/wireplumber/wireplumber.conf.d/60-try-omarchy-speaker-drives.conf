# The echo canceller links the VM's microphone and speaker into one graph.
# The microphone would win the driver election and rate-match playback to its
# own clock, which makes music wobble in pitch. Let the speaker drive; only
# the microphone is resampled, which speech tolerates.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        priority.driver = 3000
      }
    }
  }
]
