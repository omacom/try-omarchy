# Omarchy's own switch for machines without working sleep: it hides Suspend
# and Hibernate in the System menu, and systemd refuses them. A suspended VM
# has no wake source and looks frozen; the Mac's sleep pauses the VM instead.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
