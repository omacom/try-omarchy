# Try Omarchy: Chromium's launcher reads this file before the user's
# ~/.config/chromium-flags.conf. Ozone/Wayland needs this flag to take Fcitx
# input (Japanese, Chinese and Korean text).
--enable-wayland-ime

# PQ video uses the compositor's display reference instead of a fixed 203 nits.
--enable-features=UseDisplaySDRMaxLuminanceNits
