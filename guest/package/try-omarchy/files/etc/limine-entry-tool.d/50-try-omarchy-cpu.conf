# Try Omarchy: hide SME from the guest. The M4 has SME but no SVE, and QEMU
# under HVF cannot drop SME from the vCPU, so code that runs an SVE
# instruction before entering streaming mode (Slack's camera path, likely
# libyuv in Chromium and Electron apps) dies with SIGILL. Earlier Apple chips
# have no SME, so this changes nothing there.
KERNEL_CMDLINE[default]+=" arm64.nosme"
