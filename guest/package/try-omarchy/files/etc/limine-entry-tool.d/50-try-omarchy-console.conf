# Try Omarchy: also send kernel and boot messages to the VM's virtio console,
# which the Mac app keeps as console.log. The last console= becomes
# /dev/console, so console=tty0 is repeated to keep the screen primary.
# Keep Plymouth's graphical splash despite the serial console.
KERNEL_CMDLINE[default]+=" console=hvc0 console=tty0 plymouth.ignore-serial-consoles"
