# Try Omarchy: raise the graph quantum for the emulated HDA device.
#
# Delayed host audio servicing can make the emulated Intel HDA DMA position
# advance in coarse jumps. ALSA derives elapsed frames from that counter, and
# at the default quantum the jumps can trigger xruns even while the HDA ring
# still contains audio.
#
# A larger quantum means fewer, bigger position checks, which the emulated
# counter can satisfy. It reduces dropouts at the cost of added latency.
#
# The host also requests a 1 ms SDL audio timer and eight output buffers to
# reduce scheduling gaps. Graphics work can still delay QEMU's audio servicing.
context.properties = {
    default.clock.quantum     = 4096
    default.clock.min-quantum = 4096
    default.clock.max-quantum = 4096
}

# PipeWire's stock VM rule is evaluated after context.properties and lowers
# min-quantum back to 1024. A later matching rule keeps the requested quantum
# fixed at 4096 in the guest.
context.properties.rules = [
    {   matches = [ { cpu.vm.name = !null } ]
        actions = {
            update-props = {
                default.clock.min-quantum = 4096
            }
        }
    }
]
