# Try Omarchy: raise the graph quantum for the emulated HDA device.
#
# QEMU advances the emulated Intel HDA DMA position from its codec timer, so
# the reported position moves in scheduling-dependent jumps rather than
# continuously. ALSA derives elapsed frames from that counter, and at the
# default quantum the jumps are large enough relative to a period that the
# driver reports xruns even though the 682 ms ring is nowhere near empty.
#
# A larger quantum means fewer, bigger position checks, which the emulated
# counter can satisfy. This addresses guest xruns at the cost of added playback
# latency; it cannot prevent the host backend from discarding audio.
#
# This is the guest-side half of the problem. The host-side knob is
# -audiodev sdl,timer-period=1000. It drains the separate HDA output ring into
# SDL frequently enough to avoid full-ring drops under normal video playback.
context.properties = {
    default.clock.quantum     = 4096
    default.clock.min-quantum = 4096
    default.clock.max-quantum = 4096
}

# PipeWire's stock VM rule is evaluated after context.properties and lowers
# min-quantum back to 1024. A later matching rule keeps the requested quantum
# fixed at 4096 in the guest.
context.properties.rules = [
    {   matches = [ { cpu.vm.name = !null } ]
        actions = {
            update-props = {
                default.clock.min-quantum = 4096
            }
        }
    }
]
