<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Noto Sans/Serif CJK is one family with different glyph shapes per
  region (JP/KR/SC/TC/HK). Without this rule, zh-TW text can silently
  render with Simplified-Chinese or Japanese glyph variants for shared
  Han codepoints (e.g. 骨, 戶, 直, 黃, 起) even though every character
  is "covered" and nothing shows as a tofu box.

  Prefer the Traditional Chinese (TC) face whenever the requested text
  language is Taiwan Chinese, for the generic families the desktop
  actually resolves through (sans-serif, serif, monospace). Scoped to
  those generic requests only, so an explicit non-generic family
  request (e.g. a page pinning "Arial") is left alone.

  Two lang tests per generic family:
   - "zh-tw": fontconfig's own recognized orthography code for
     Chinese (Taiwan). This is what most toolkits resolve a
     lang="zh-TW"/"zh-Hant-TW" element down to today.
   - "zh-hant": not one of fontconfig's built-in orthography codes,
     but compare="contains" still matches it (and prefix forms like
     "zh-Hant-TW") via fontconfig's plain string containment fallback
     for language tags it doesn't recognize. Kept as a defensive
     second test in case a toolkit passes the BCP-47 script subtag
     straight through uncanonicalized.

  Numbered 30 (not a high number like the other try-omarchy conf.d
  overlays): fontconfig's own conf.d/README defines numeric-range
  semantics, and 30-39 is "family substitution". This must run before
  40-49 (generic identification) and 60-69 (generic aliases / the
  <prefer> fallback lists, e.g. 65-nonlatin.conf) so our TC preference
  is already at the front of the family list by the time those later
  stages append their fallback chains.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <test name="lang" compare="contains">
      <string>zh-tw</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <test name="lang" compare="contains">
      <string>zh-hant</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <test name="lang" compare="contains">
      <string>zh-tw</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <test name="lang" compare="contains">
      <string>zh-hant</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <test name="lang" compare="contains">
      <string>zh-tw</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK TC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <test name="lang" compare="contains">
      <string>zh-hant</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK TC</string>
    </edit>
  </match>
</fontconfig>
