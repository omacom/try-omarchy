# ARM runtime repositories: ALARM supplies the base system; Omarchy stable
# supplies signed aarch64 applications. The factory derives its separate
# keyring-only bootstrap repository from this configuration.
[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
# QEMU direct-boots the kernel and initramfs paired with this VM disk. Keep its
# installed modules and DKMS headers on that exact ABI. Hyprland is likewise
# held until upstream includes our rounded-border coverage backport; otherwise
# a routine full-system update can silently restore the defect. Hold the
# reviewed aquamarine/Hyprtoolkit pair too: later ALARM builds may require a
# different libaquamarine.so and abort the updater with mixed ABI requirements.
# Hold hyprland-guiutils too: newer builds can require a different libhyprtoolkit.so.
IgnorePkg = linux-aarch64 linux-aarch64-headers hyprland aquamarine hyprtoolkit hyprland-guiutils
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

[omarchy]
SigLevel = Required DatabaseOptional TrustedOnly
Server = https://pkgs.omarchy.org/stable/$arch
